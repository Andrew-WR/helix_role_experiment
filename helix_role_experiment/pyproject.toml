[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-role-experiment"
version = "0.1.0"
description = "Causal audit of a candidate low-frequency activation subspace"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
analysis = ["pandas>=2", "pyarrow>=14", "matplotlib>=3.8", "scipy>=1.10", "statsmodels>=0.14"]
model = [
  "torch>=2.2",
  "transformers>=5.14.1,<6",
  "accelerate>=0.30",
  "safetensors>=0.4",
  "peft>=0.18",
  "bitsandbytes>=0.45",
  "sentence-transformers>=2.7"
]
test = ["pytest>=8"]
labeling = ["openai>=1.99"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
